[package]
name = "ignite-io"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Ignite IO substrate: TCP listener and stream, standard input and output, terminal mode, tasks, runtime entry point. Blocking std::net and std::thread; both targets call it."
autotests = false

[dependencies]
corosensei = "0.3.4"
nix = { workspace = true, features = ["signal", "dir", "poll", "resource", "event", "socket"] }
rustls = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
nix = { workspace = true, features = ["feature"] }

[dev-dependencies]
ignite-io = { path = ".", features = ["tls"] }
rcgen.workspace = true

[features]
runner = []
tls = ["dep:rustls"]

[[test]]
name = "main"
path = "tests/main.rs"
