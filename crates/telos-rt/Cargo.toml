[package]
name = "telos-rt"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Telos runtime for the LLVM target: the telos-io substrate behind a C ABI."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
telos-io.workspace = true
nix = { workspace = true, features = ["signal"] }

[features]
runner = ["telos-io/runner"]
