[package]
name = "telos"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Telos management CLI: check, emit and build Telos programs."

[[bin]]
name = "telos"
path = "src/main.rs"

[dependencies]
telos-syntax.workspace = true
telos-check.workspace = true
telos-rustgen.workspace = true
telos-types.workspace = true
telos-llvm.workspace = true
clap.workspace = true

[dev-dependencies]
nix.workspace = true
telos-rt = { workspace = true, features = ["runner"] }
