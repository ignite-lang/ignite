[package]
name = "ignite"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Ignite management CLI: check, emit and build Ignite programs."
autotests = false

[[bin]]
name = "ignite"
path = "src/main.rs"
# CLI cases use CARGO_BIN_EXE_ignite; re-enable before adding binary unit tests.
test = false
bench = false

[dependencies]
ignite-syntax.workspace = true
ignite-check.workspace = true
ignite-rustgen.workspace = true
ignite-types.workspace = true
ignite-llvm.workspace = true
ignite-eval.workspace = true
clap.workspace = true
sha2 = "0.10"
nix = { workspace = true, features = ["poll", "process", "signal"] }

[dev-dependencies]
ignite-rt = { workspace = true, features = ["runner"] }

[[test]]
name = "main"
path = "tests/main.rs"
