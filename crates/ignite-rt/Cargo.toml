[package]
name = "ignite-rt"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Ignite runtime for the LLVM target: the ignite-io substrate behind a C ABI."
autotests = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ignite-io = { workspace = true, features = ["process", "tls"] }
nix = { workspace = true, features = ["signal", "mman"] }

[dev-dependencies]
nix = { workspace = true, features = ["term"] }

[features]
runner = ["ignite-io/runner"]
panic-probe = []

[[test]]
name = "main"
path = "tests/main.rs"
