name: valgrind

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "wave/**"]

permissions:
  contents: read

concurrency:
  group: valgrind-${{ github.ref }}
  cancel-in-progress: true

env:
  VALGRIND_VERSION: "1:3.24.0-3"
  TASK_VERSION: v3.54.0
  TASK_SHA256: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb

jobs:
  valgrind:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ignite-lang/ignite-toolchain:0.16.4@sha256:1112846a01ff2acea8b348658196b04c18bf6346c74ad4357e0f55ac4e20ccb1
    env:
      CARGO_NET_OFFLINE: "false"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install valgrind and task
        run: |
          apt-get update
          apt-get install -y --no-install-recommends "valgrind=${VALGRIND_VERSION}" libc6-dbg
          curl -sSL -o "$RUNNER_TEMP/task.tar.gz" "https://github.com/go-task/task/releases/download/${TASK_VERSION}/task_linux_amd64.tar.gz"
          echo "${TASK_SHA256}  $RUNNER_TEMP/task.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C /usr/local/bin task
          valgrind --version
          valgrind -q true
          task --version

      - name: Run the valgrind tests
        run: task test-valgrind
