[workspace]
resolver = "3"
members = [
    "crates/ignite-syntax",
    "crates/ignite-check",
    "crates/ignite-rustgen",
    "crates/ignite-io",
    "crates/ignite",
    "crates/ignite-types",
    "crates/ignite-rt",
    "crates/ignite-llvm",
    "crates/ignite-load",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
ignite-syntax = { path = "crates/ignite-syntax" }
ignite-check = { path = "crates/ignite-check" }
ignite-rustgen = { path = "crates/ignite-rustgen" }
ignite-io = { path = "crates/ignite-io" }
ignite = { path = "crates/ignite" }
ignite-types = { path = "crates/ignite-types" }
ignite-rt = { path = "crates/ignite-rt" }
ignite-llvm = { path = "crates/ignite-llvm" }
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.31", features = ["term", "fs"] }

[profile.release.package.ignite-rt]
codegen-units = 1
