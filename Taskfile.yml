version: '3'

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

vars:
  EXAMPLE: examples/terminal/terminal.ignite
  OUT: target/ignite/terminal
  OUT_LLVM: target/ignite-llvm/terminal
  TODO: examples/todo/todo.ignite
  TODO_OUT: target/ignite/todo
  TODO_OUT_LLVM: target/ignite-llvm/todo

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build every crate and the ignite CLI
    cmds:
      - cargo build --workspace

  test:
    desc: Run every unit, fixture, golden and end-to-end test, then the inline Ignite tests
    cmds:
      - cargo test --workspace
      - task: test-ignite

  test-ignite:
    desc: Run the inline Ignite tests of std/ and examples/ on both targets (FILTER=text selects tests)
    vars:
      FILES:
        sh: find std examples -name '*.ignite' ! -name '*.design.ignite' | sort | tr '\n' ' '
      SELECT: '{{if .FILTER}}"{{.FILTER}}"{{end}}'
      T: '{{.CARGO_TARGET_DIR | default "target"}}'
    cmds:
      - cargo build -q -p ignite
      - cargo build -q -p ignite-rt --features runner --target-dir {{.T}}/ignite-test/rt
      - '{{.T}}/debug/ignite test {{.FILES}} {{.SELECT}} --target=all --out {{.T}}/ignite-test --target-dir {{.T}}/ignite-test/cargo --runtime {{.T}}/ignite-test/rt/debug/libignite_rt.a'

  check:
    desc: Format check and clippy with warnings denied
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  gate:
    desc: Everything a merge must pass
    cmds:
      - task: check
      - task: test
      - task: ux

  quality:
    desc: Measure every instrumented metric of docs/quality.md once and append the run to quality/history.jsonl (RUN=vX.Y.Z for a release, which is refused when worse than the last)
    vars:
      WORK:
        sh: echo "${IGNITE_QUALITY_WORK:-${XDG_CACHE_HOME:-$HOME/.cache}/ignite/quality}"
      T: '{{.CARGO_TARGET_DIR | default "target"}}'
    env:
      RUST_TEST_THREADS: "4"
      IGNITE_QUALITY_RUN: '{{.RUN | default "run"}}'
      IGNITE_DIFFERENTIAL_SLOW: "1"
    cmds:
      - cargo build -q -p ignite -p ignite-perf
      - cargo build -q -p ignite-rt --features runner --target-dir {{.T}}/ignite-test/rt
      - cargo test -q -p ignite --test main -- differential::corpus quality::static_metrics_hold_the_bar quality::conformance_claims_hold_the_bar
      - '{{.T}}/debug/ignite-perf quality --cli {{.T}}/debug/ignite --runtime {{.T}}/ignite-test/rt/debug/libignite_rt.a --work {{.WORK}} --out target/quality/perf-metrics.json'
      - cargo test -q -p ignite --test main -- --ignored --exact quality::record

  compile:
    desc: Compile the terminal example with ignite --target rust into target/ignite/terminal
    cmds:
      - cargo run -q -p ignite -- build {{.EXAMPLE}} --target rust --out {{.OUT}} --target-dir target

  compile-llvm:
    desc: Compile the terminal example with ignite --target llvm into target/ignite-llvm/terminal
    vars:
      T: '{{.CARGO_TARGET_DIR | default "target"}}'
    cmds:
      - cargo build -q -p ignite
      - cargo build -q -p ignite-rt --features runner --target-dir {{.T}}/ignite-test/rt
      - cargo run -q -p ignite -- build {{.EXAMPLE}} --target llvm --out {{.OUT_LLVM}} --runtime {{.T}}/ignite-test/rt/debug/libignite_rt.a

  compile-todo:
    desc: Compile the todo example with ignite --target rust into target/ignite/todo
    cmds:
      - cargo run -q -p ignite -- build {{.TODO}} --target rust --out {{.TODO_OUT}} --target-dir target

  compile-todo-llvm:
    desc: Compile the todo example with ignite --target llvm into target/ignite-llvm/todo
    vars:
      T: '{{.CARGO_TARGET_DIR | default "target"}}'
    cmds:
      - cargo build -q -p ignite
      - cargo build -q -p ignite-rt --features runner --target-dir {{.T}}/ignite-test/rt
      - cargo run -q -p ignite -- build {{.TODO}} --target llvm --out {{.TODO_OUT_LLVM}} --runtime {{.T}}/ignite-test/rt/debug/libignite_rt.a

  dist:
    desc: Build the release ignite for Linux x86_64 (glibc, statically linked) and pack it with std/ as T/dist/ignite-VERSION-x86_64-linux.tar.gz (bin/ignite, share/ignite/std)
    vars:
      T: '{{.CARGO_TARGET_DIR | default "target"}}'
      VERSION:
        sh: cargo pkgid -p ignite | sed 's/.*[#@]//'
      NAME: ignite-{{.VERSION}}-x86_64-linux
      DIR: '{{.T}}/dist/{{.NAME}}'
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-feature=+crt-static
    cmds:
      - cargo build --release --locked -p ignite --target x86_64-unknown-linux-gnu
      - rm -rf '{{.DIR}}' '{{.DIR}}.tar.gz'
      - mkdir -p '{{.DIR}}/bin' '{{.DIR}}/share/ignite'
      - cp '{{.T}}/x86_64-unknown-linux-gnu/release/ignite' '{{.DIR}}/bin/ignite'
      - cp -R std '{{.DIR}}/share/ignite/std'
      - cp README.md '{{.DIR}}/'
      - tar -czf '{{.DIR}}.tar.gz' -C '{{.T}}/dist' '{{.NAME}}'
      - '''{{.DIR}}/bin/ignite'' --version'
      - echo 'built {{.DIR}}.tar.gz'

  image:
    desc: Build the toolchain image ghcr.io/ignite-lang/ignite-toolchain:VERSION from release vVERSION's archive and the tag's source
    requires:
      vars: [VERSION]
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} -t ghcr.io/ignite-lang/ignite-toolchain:{{.VERSION}} dist/toolchain

  image-check:
    desc: Check the toolchain image of VERSION (IMAGE overrides the reference) builds and serves the todo example on both targets, offline
    requires:
      vars: [VERSION]
    vars:
      IMAGE: '{{.IMAGE | default (print "ghcr.io/ignite-lang/ignite-toolchain:" .VERSION)}}'
    env:
      IGNITE_IMAGE: '{{.IMAGE}}'
      IGNITE_VERSION: '{{.VERSION}}'
    cmds:
      - 'cargo test -p ignite --test main image:: -- --ignored --exact image::the_image_builds_and_serves_the_todo_example_on_both_targets'

  todo-server:
    desc: Run the compiled todod on 127.0.0.1:8080 (PORT=n to override, TARGET=llvm for the LLVM build)
    vars:
      BIN: '{{if eq .TARGET "llvm"}}{{.TODO_OUT_LLVM}}/bin{{else}}target/debug{{end}}'
    cmds:
      - task: '{{if eq .TARGET "llvm"}}compile-todo-llvm{{else}}compile-todo{{end}}'
      - '{{.BIN}}/todod --port {{.PORT | default "8080"}}'

  bench:
    desc: Print terminald sizes, build times and startup time of both targets and profiles
    cmds:
      - cargo test -q -p ignite --test main -- --ignored --exact llvm_build::bench --nocapture

  bench-throughput:
    desc: Build both targets' release terminald and print the throughput matrix (CELLS=rr:16,pipe:256 and RUNS=n narrow it)
    cmds:
      - cargo build -q --release -p ignite-rt -p ignite-load
      - cargo build -q -p ignite
      - target/debug/ignite build {{.EXAMPLE}} --target rust --release --out target/bench/rust --target-dir target/bench/rust-target
      - target/debug/ignite build {{.EXAMPLE}} --target llvm --release --runtime target/release/libignite_rt.a --out target/bench/llvm
      - target/release/ignite-load matrix --server rust=target/bench/rust-target/release/terminald --server llvm=target/bench/llvm/bin/terminald --runs {{.RUNS | default "3"}} {{if .CELLS}}--cells {{.CELLS}}{{end}} --out target/bench/throughput.jsonl

  server:
    desc: Run the compiled terminald on 127.0.0.1:2323 (PORT=n to override, TARGET=llvm for the LLVM build)
    vars:
      BIN: '{{if eq .TARGET "llvm"}}{{.OUT_LLVM}}/bin{{else}}target/debug{{end}}'
    cmds:
      - task: '{{if eq .TARGET "llvm"}}compile-llvm{{else}}compile{{end}}'
      - '{{.BIN}}/terminald --port {{.PORT | default "2323"}}'

  client:
    desc: Run the compiled tn client against 127.0.0.1:2323 (PORT=n to override, TARGET=llvm for the LLVM build)
    vars:
      BIN: '{{if eq .TARGET "llvm"}}{{.OUT_LLVM}}/bin{{else}}target/debug{{end}}'
    cmds:
      - task: '{{if eq .TARGET "llvm"}}compile-llvm{{else}}compile{{end}}'
      - '{{.BIN}}/tn --port {{.PORT | default "2323"}}'

  site:
    desc: Build the website into target/site, the landing page at the root and the book under book/
    cmds:
      - rm -rf target/site
      - mkdir -p target/site
      - cp -R site/index.html site/assets target/site/
      - mdbook build site/book --dest-dir target/site/book
      - cp target/site/book/404.html target/site/404.html

  ux-deps:
    desc: Link ux/node_modules to the shared install for ux/package-lock.json, from the npm cache without network when it is missing
    vars:
      CACHE:
        sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/ignite/ux/$(sha256sum ux/package-lock.json | cut -c1-16)"
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    status:
      - test -e ux/node_modules/.bin/playwright && { test ! -L ux/node_modules || { test "$(readlink ux/node_modules)" = "{{.CACHE}}/node_modules" && test -e {{.CACHE}}/ready; }; }
    cmds:
      - silent: true
        cmd: 'test -e {{.CACHE}}/ready -a -e {{.CACHE}}/node_modules/.bin/playwright || (rm -f {{.CACHE}}/ready && mkdir -p {{.CACHE}} && cp ux/package.json ux/package-lock.json {{.CACHE}}/ && cd {{.CACHE}} && npm ci --offline --no-audit --no-fund --loglevel=error > npm-ci.log 2>&1 && touch ready) || (rm -rf {{.CACHE}}/node_modules; echo "ux: Playwright and axe-core for this lockfile are neither in {{.CACHE}} nor in the npm cache; run once, with network: task ux-install"; exit 1)'
      - ln -sfn {{.CACHE}}/node_modules ux/node_modules

  ux-install:
    desc: Once per lockfile, with network, install the pinned Playwright and axe-core into the shared cache that task ux links
    vars:
      CACHE:
        sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/ignite/ux/$(sha256sum ux/package-lock.json | cut -c1-16)"
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    cmds:
      - mkdir -p {{.CACHE}} && cp ux/package.json ux/package-lock.json {{.CACHE}}/
      - cd {{.CACHE}} && npm ci --no-audit --no-fund && touch ready
      - task: ux-deps

  ux:
    desc: Build the website, run the layout contract (L2) and the screen-only user (L3) on it, then the ratchet against ux/baseline.json
    cmds:
      - task: site
      - task: ux-deps
      - cd ux && npx --no-install playwright test
      - cargo test -q -p ignite --test main -- --ignored --exact site::ux::ratchet || exit 1

  ux-round:
    desc: Write ux/rounds/ROUND (task ux-round ROUND=R-01) from the gating suite and the trial of the scenario cards; not part of the gate
    requires:
      vars: [ROUND]
    cmds:
      - task: site
      - task: ux-deps
      - rm -rf target/ux/metrics.json target/ux/gating.json target/ux/missed
      - cmd: cd ux && npx --no-install playwright test
        ignore_error: true
      - cd ux && UX_ROUND={{.ROUND}} npx --no-install playwright test --config round.config.ts
      - UX_ROUND={{.ROUND}} cargo test -q -p ignite --test main -- --ignored --exact site::round::write

  site-serve:
    desc: Build the website and serve target/site on http://127.0.0.1:8765/
    cmds:
      - task: site
      - miniserve --index index.html -p 8765 target/site
