version: '3'

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

vars:
  EXAMPLE: examples/terminal/terminal.telos
  OUT: target/telos/terminal
  OUT_LLVM: target/telos-llvm/terminal
  TODO: examples/todo/todo.telos
  TODO_OUT: target/telos/todo
  TODO_OUT_LLVM: target/telos-llvm/todo

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build every crate and the telos CLI
    cmds:
      - cargo build --workspace

  test:
    desc: Run every unit, fixture, golden and end-to-end test, then the inline Telos tests
    cmds:
      - cargo test --workspace
      - task: test-telos

  test-telos:
    desc: Run the inline Telos tests of std/ and examples/ on both targets (FILTER=text selects tests)
    vars:
      FILES:
        sh: find std examples -name '*.telos' ! -name '*.design.telos' | sort | tr '\n' ' '
      SELECT: '{{if .FILTER}}"{{.FILTER}}"{{end}}'
    cmds:
      - cargo build -q -p telos
      - cargo build -q -p telos-rt --features runner --target-dir target/telos-test/rt
      - target/debug/telos test {{.FILES}} {{.SELECT}} --out target/telos-test --target-dir target/telos-test/cargo
      - target/debug/telos test {{.FILES}} {{.SELECT}} --target llvm --out target/telos-test --runtime target/telos-test/rt/debug/libtelos_rt.a

  check:
    desc: Format check and clippy with warnings denied
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  gate:
    desc: Everything a merge must pass
    cmds:
      - task: check
      - task: test

  compile:
    desc: Compile the terminal example with telos into target/telos/terminal
    cmds:
      - cargo run -q -p telos -- build {{.EXAMPLE}} --out {{.OUT}} --target-dir target

  compile-llvm:
    desc: Compile the terminal example with telos --target llvm into target/telos-llvm/terminal
    cmds:
      - cargo build -q -p telos
      - cargo build -q -p telos-rt --features runner --target-dir target/telos-test/rt
      - cargo run -q -p telos -- build {{.EXAMPLE}} --target llvm --out {{.OUT_LLVM}}

  compile-todo:
    desc: Compile the todo example with telos into target/telos/todo
    cmds:
      - cargo run -q -p telos -- build {{.TODO}} --out {{.TODO_OUT}} --target-dir target

  compile-todo-llvm:
    desc: Compile the todo example with telos --target llvm into target/telos-llvm/todo
    cmds:
      - cargo build -q -p telos
      - cargo build -q -p telos-rt --features runner --target-dir target/telos-test/rt
      - cargo run -q -p telos -- build {{.TODO}} --target llvm --out {{.TODO_OUT_LLVM}}

  todo-server:
    desc: Run the compiled todod on 127.0.0.1:8080 (PORT=n to override, TARGET=llvm for the LLVM build)
    vars:
      BIN: '{{if eq .TARGET "llvm"}}{{.TODO_OUT_LLVM}}/bin{{else}}target/debug{{end}}'
    cmds:
      - task: '{{if eq .TARGET "llvm"}}compile-todo-llvm{{else}}compile-todo{{end}}'
      - '{{.BIN}}/todod --port {{.PORT | default "8080"}}'

  bench:
    desc: Print terminald sizes, build times and startup time of both targets and profiles
    cmds:
      - cargo test -q -p telos --test llvm_build -- --ignored --exact bench --nocapture

  bench-throughput:
    desc: Build both targets' release terminald and print the throughput matrix (CELLS=rr:16,pipe:256 and RUNS=n narrow it)
    cmds:
      - cargo build -q --release -p telos-rt -p telos-load
      - cargo build -q -p telos
      - target/debug/telos build {{.EXAMPLE}} --release --out target/bench/rust --target-dir target/bench/rust-target
      - target/debug/telos build {{.EXAMPLE}} --target llvm --release --runtime target/release/libtelos_rt.a --out target/bench/llvm
      - target/release/telos-load matrix --server rust=target/bench/rust-target/release/terminald --server llvm=target/bench/llvm/bin/terminald --runs {{.RUNS | default "3"}} {{if .CELLS}}--cells {{.CELLS}}{{end}} --out target/bench/throughput.jsonl

  server:
    desc: Run the compiled terminald on 127.0.0.1:2323 (PORT=n to override, TARGET=llvm for the LLVM build)
    vars:
      BIN: '{{if eq .TARGET "llvm"}}{{.OUT_LLVM}}/bin{{else}}target/debug{{end}}'
    cmds:
      - task: '{{if eq .TARGET "llvm"}}compile-llvm{{else}}compile{{end}}'
      - '{{.BIN}}/terminald --port {{.PORT | default "2323"}}'

  client:
    desc: Run the compiled tn client against 127.0.0.1:2323 (PORT=n to override, TARGET=llvm for the LLVM build)
    vars:
      BIN: '{{if eq .TARGET "llvm"}}{{.OUT_LLVM}}/bin{{else}}target/debug{{end}}'
    cmds:
      - task: '{{if eq .TARGET "llvm"}}compile-llvm{{else}}compile{{end}}'
      - '{{.BIN}}/tn --port {{.PORT | default "2323"}}'
